workflows:
  android-debug:
    name: Controle Glicêmico - Android APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Preparar Android local.properties
        script: |
          mkdir -p "$CM_BUILD_DIR/android"
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Instalar dependências Flutter
        script: |
          flutter pub get

      - name: Verificar ambiente Android
        script: |
          java -version
          flutter --version

      - name: Verificar projeto Flutter
        script: |
          flutter analyze

      - name: Limpar recursos Android antigos incompatíveis
        script: |
          # Remove ícones adaptive-icon antigos que possam ter permanecido no repositório.
          find android/app/src/main/res -type f -path '*/mipmap-*/*' -name 'ic_launcher.xml' -delete

          # Compatível com o shell do ambiente Codemagic: remove qualquer XML
          # que contenha <adaptive-icon, sem usar xargs -r.
          find android/app/src/main/res -type f -name '*.xml' -exec sh -c '
            for file do
              if grep -q "<adaptive-icon" "$file"; then
                echo "Removendo recurso incompatível: $file"
                rm -f "$file"
              fi
            done
          ' sh {} +

          if grep -R '<adaptive-icon' -n android/app/src/main/res 2>/dev/null; then
            echo 'Erro: ainda existe adaptive-icon nos recursos Android após a limpeza.'
            exit 1
          fi

          echo 'Recursos Android verificados: nenhum adaptive-icon incompatível encontrado.'

      - name: Diagnóstico SHA-1 do Android
        script: |
          echo "===== SHA-1 DO DEBUG KEYSTORE CODEMAGIC ====="
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA-1:" || true
          else
            echo "debug.keystore não encontrado; procurando keystores disponíveis..."
            find "$HOME/.android" -maxdepth 2 -type f -name '*.keystore' -o -name '*.jks' 2>/dev/null || true
          fi
          echo "=============================================="

      - name: Gerar APK Android
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
